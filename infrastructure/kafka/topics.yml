# YAML was chosen over JSON because topic settings and their operational comments need to be
# readable during review. scripts/apply-topics.sh intentionally supports this flat manifest only.
topics:
  - name: transactions.raw
    partitions: 6
    replication_factor: 1
    configs:
      cleanup.policy: delete
      retention.ms: 172800000 # 48 hours: replay room without treating dev Kafka as an archive.
      compression.type: snappy
      min.insync.replicas: 1

  - name: transactions.deadletter
    partitions: 6
    replication_factor: 1
    configs:
      cleanup.policy: delete
      retention.ms: 1209600000 # 14 days: low-volume diagnostic evidence outlives raw input.
      compression.type: snappy
      min.insync.replicas: 1

  - name: transactions.late
    partitions: 6
    replication_factor: 1
    configs:
      cleanup.policy: delete
      retention.ms: 1209600000 # 14 days: supports later watermark and lateness analysis.
      compression.type: snappy
      min.insync.replicas: 1

  - name: analytics.aggregates
    partitions: 6
    replication_factor: 1
    configs:
      cleanup.policy: delete
      retention.ms: 604800000 # 7 days: downstream consumers get a bounded replay window.
      compression.type: snappy
      min.insync.replicas: 1
